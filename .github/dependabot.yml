version: 2
updates:
  # Keep GitHub Actions pinned to SHAs but auto-bumped when upstream releases.
  # Dependabot updates the pinned commit and the trailing "# vX" comment together.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      actions:
        patterns:
          - "*"
    commit-message:
      prefix: "ci"

  # Every runtime and dev pin is exact, so nothing moves without a PR. Until
  # now nothing opened those PRs either: `safety` in the DevSecOps pipeline
  # reports a dependency CVE and turns the job red, but has no way to propose
  # the bump — see the hand-written CVE notes in requirements.txt. Split into
  # two groups because the blast radius differs: a dev-tooling bump can only
  # break CI, a runtime bump ships. Group order is load-bearing — a dependency
  # lands in the first group it matches, so dev-tooling must stay above the
  # catch-all "*" or everything would be one runtime PR.
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      dev-tooling:
        patterns:
          - "pytest*"
          - "pylint"
          - "black"
          - "flake8"
          - "isort"
          - "mypy"
          - "bandit"
          - "coverage"
          - "safety"
          - "cyclonedx-bom"
          - "types-*"
      runtime:
        patterns:
          - "*"
    # python-hcl2 4 -> 8 is a parser rewrite, not a version bump, and it sits
    # under every scan. v8 returns block keys and string values still wrapped in
    # their literal quotes and adds an `__is_block__` marker, so
    # `resource["aws_iam_role"]` no longer matches and every structural feature
    # reads zero: iam_resource_count 2 -> 0, logging_resource_count 2 -> 0,
    # ingress_rule_count 1 -> 0, encryption_coverage 0.5 -> 1.0, and the API
    # risk score for the vulnerable fixture falls from >=70 to 52.
    #
    # Verified that it is the *only* blocker: with hcl2 held at 4.3.2 the other
    # 21 updates in the runtime group — numpy 2.2.6, scikit-learn 1.7.2,
    # fastapi 0.141.1 among them — pass the full suite, 196/196.
    #
    # Minor and patch updates still flow. Lift this ignore as part of a
    # deliberate migration of parser.py and the feature extractor, not as a
    # side effect of a grouped dependency PR.
    ignore:
      - dependency-name: "python-hcl2"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "deps"
