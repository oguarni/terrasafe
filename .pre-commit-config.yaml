# Pre-commit hooks for TerraVault
repos:
  # Python code formatting
  - repo: https://github.com/psf/black
    rev: 24.10.0
    hooks:
      - id: black
        language_version: python3.10

  # Python import sorting
  - repo: https://github.com/pycqa/isort
    rev: 5.13.2
    hooks:
      - id: isort
        args: ["--profile", "black"]

  # Python linting
  - repo: https://github.com/pycqa/flake8
    rev: 7.1.1
    hooks:
      - id: flake8
        args: ["--max-line-length=120", "--ignore=E226,E402,E501,W503,W504"]

  # Static type checking — mirrors the mypy step in the CI quality gate, which
  # previously ran nowhere locally, so type regressions only surfaced on the PR.
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.14.1
    hooks:
      - id: mypy
        args: ["--config-file", "mypy.ini", "--ignore-missing-imports"]
        files: ^terravault/
        additional_dependencies:
          - pydantic>=2.0
          - types-requests

  # Security scanning
  - repo: https://github.com/PyCQA/bandit
    rev: 1.8.3
    hooks:
      - id: bandit
        args: ["-r", "terravault/", "--ini", ".bandit", "-ll"]
        exclude: ^test_

  # Secret detection. gitleaks only, deliberately: the DevSecOps pipeline gates
  # on gitleaks, so a clean hook here means that check passes. detect-secrets
  # was also configured, with no `.secrets.baseline` and no --baseline arg — a
  # second engine with different findings and no allowlist can only disagree
  # with the gate, and a hook that fails on something CI accepts trains people
  # to reach for --no-verify. GitHub secret scanning + push protection are
  # enabled on the repo and cover the server side.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  # Terraform file validation
  - repo: local
    hooks:
      - id: terravault-scan
        name: TerraVault Security Scan
        entry: python -m terravault.cli
        language: system
        files: \.tf$
        pass_filenames: true
