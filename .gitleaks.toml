# Gitleaks configuration for TerraVault
# TerraVault is a Terraform security scanner, so test files intentionally
# contain hardcoded secrets as test fixtures for vulnerability detection.

title = "TerraVault Gitleaks Configuration"

# Load gitleaks' built-in ruleset.
#
# This block is load-bearing. A config that declares only an [allowlist] and no
# [extend] loads ZERO detection rules, so `gitleaks detect` reports "no leaks
# found" unconditionally -- which silently neutered both the pre-commit hook and
# the `security-scan` gate in .github/workflows/devsecops.yml, the one place
# CLAUDE.md says secret detection is enforced. Never remove this.
[extend]
useDefault = true

# Allow rules - paths and patterns that are intentional/safe to ignore
[allowlist]
  description = "TerraVault test fixtures and example files with intentional secrets"

  # Test fixture files that intentionally contain vulnerable configurations
  paths = [
    '''test_files/.*\.tf$''',
    '''tests/test_.*\.py$''',
    '''\.env\.example$''',
    # Machine-generated corpus provenance from the ML calibration runs. These
    # dumps record the git revision of every mined module, and a bare 40-hex
    # revision in a codeload.github.com URL matches the sourcegraph-access-token
    # rule. Regenerated by scripts/gcp_ml_calibration.sh; not hand-edited.
    '''evaluation/results/ml_calibration.*/(live/)?collect_.*\.txt$''',
  ]

  # Documentation placeholders. These are the literal strings printed in README,
  # QUICKSTART and the API docstring so a reader knows where their own key goes.
  regexes = [
    '''(?i)your[-_]api[-_]key(?:[-_]here)?''',
    '''REDACTED_API_KEY''',
  ]
