[mypy]
python_version = 3.10
warn_return_any = True
warn_unused_configs = True
ignore_missing_imports = True

# Global default stays permissive so the remaining layers can be tightened one
# at a time rather than in a single sweeping change. Each per-module section
# below is a layer that has been brought to fully annotated signatures and must
# stay that way — move a layer up here once its annotations are complete, and
# do not relax a section that already passes.
disallow_untyped_defs = False

# Core business logic: the security rule engine and domain entities. Annotated
# and strict as of 2026-07-26.
[mypy-terravault.domain.*]
disallow_untyped_defs = True

# Data-access adapters, brought to 100% test coverage and fully annotated.
[mypy-terravault.infrastructure.repositories]
disallow_untyped_defs = True

[mypy-terravault.infrastructure.rate_limiter]
disallow_untyped_defs = True

[mypy-terravault.infrastructure.validation]
disallow_untyped_defs = True

[mypy-terravault.infrastructure.utils]
disallow_untyped_defs = True
